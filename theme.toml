# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name        = "Color Your World"
license     = "MIT"
licenselink = "https://github.com/sprytnyk/hugo-theme-color-your-world/blob/master/LICENSE"
description = "A minimal, privacy-aware theme for personal sites and technical blogs, with dark and light modes and an accent color visitors pick."
min_version = "0.141.0"

# The home page of the theme, where the source can be found.
homepage = "https://github.com/sprytnyk/hugo-theme-color-your-world"

tags = [
  "accessible",
  "blog",
  "contact form",
  "dark",
  "fast",
  "highlighting",
  "light",
  "minimalist",
  "modern",
  "multilingual",
  "personal",
  "responsive",
  "search",
  "technical",
]

features = [
  "dark mode",
  "noscript",
  "privacy",
  "syntax highlighting",
]

[author]
  name     = "Vladyslav Krylasov"
  homepage = "https://github.com/sprytnyk"

# This is a fork of the original Color Your World
[original]
  author   = "Raphael Aguiar"
  homepage = "https://gitlab.com/rmaguiar"
  repo     = "https://gitlab.com/rmaguiar/hugo-theme-color-your-world"
