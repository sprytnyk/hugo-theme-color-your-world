# Test site for the theme's tests. The tests copy it to a temp folder, link
# the theme in, add their own settings at the end and build it. It uses most
# of the theme's features. The tests add the giscus settings.

baseURL                = "https://example.org/"
title                  = "Smoke test"
theme                  = "color-your-world"
defaultContentLanguage = "en"
copyright              = "Copyright © 2026, Jane Doe"

[pagination]
  pagerSize = 10

[markup.highlight]
  noClasses = false

# Block the network, so the YouTube shortcode has to fall back to its placeholder
[security.http]
  urls = ["^$"]

[privacy.youtube]
  privacyEnhanced = true

[languages.en]
  languageName = "English"
  weight       = 1

[languages.uk]
  languageName = "Українська"
  weight       = 2

[params]
  description       = "Test site for the theme's tests"
  author            = "Jane Doe"
  authorDesc        = "Software Engineer"
  footerText        = ["Built with [Hugo](https://gohugo.io)."]
  hasNoscriptNotice = true
  titleSeparator    = "|"

  [params.search]
    enable = true

  [params.style]
    isDark                      = true
    presets                     = ["#34d399", "#a78bfa"]
    hasIconAsFootnoteReturnLink = true
    hideAnchors                 = true

  [params.social.centralized]
    github = ["janedoe"]

  [params.social.decentralized.mastodon]
    1 = ["https://mastodon.social/@janedoe", "mastodon.social"]

  [params.contact]
    formspreeFormId = "example"
